<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>.watch { fill: #06b6d4; stroke: #0891b2; stroke-width: 1; }</style>
  </defs>
  <g class="watch">
    <!-- Watch band top -->
    <rect x="40" y="10" width="20" height="15" rx="4" fill="#0891b2"/>
    <!-- Watch face -->
    <circle cx="50" cy="50" r="25" fill="#06b6d4" stroke="#0891b2" stroke-width="2"/>
    <!-- Watch screen -->
    <circle cx="50" cy="50" r="20" fill="#e0f2fe" stroke="#0891b2" stroke-width="1"/>
    <!-- Hour hand -->
    <line x1="50" y1="50" x2="50" y2="35" stroke="#0891b2" stroke-width="2" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="50" y1="50" x2="58" y2="45" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="50" cy="50" r="3" fill="#0891b2"/>
    <!-- Watch band bottom -->
    <rect x="40" y="75" width="20" height="15" rx="4" fill="#0891b2"/>
  </g>
</svg>