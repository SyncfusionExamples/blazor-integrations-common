<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>.phone { fill: #1f2937; stroke: #111827; stroke-width: 1; }</style>
  </defs>
  <g class="phone">
    <!-- Phone body -->
    <rect x="30" y="15" width="40" height="70" rx="4" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
    <!-- Phone screen -->
    <rect x="33" y="20" width="34" height="52" rx="2" fill="#0f172a" stroke="#111827" stroke-width="0.5"/>
    <!-- Status bar -->
    <rect x="33" y="20" width="34" height="4" fill="#374151"/>
    <!-- Notch -->
    <rect x="42" y="20" width="16" height="3" rx="1" fill="#111827"/>
    <!-- Screen content -->
    <circle cx="50" cy="35" r="8" fill="#6366f1"/>
    <rect x="38" y="50" width="24" height="3" rx="1" fill="#4b5563"/>
    <rect x="38" y="56" width="24" height="3" rx="1" fill="#4b5563"/>
    <!-- Home button -->
    <circle cx="50" cy="76" r="4" fill="#374151" stroke="#111827" stroke-width="1"/>
  </g>
</svg>