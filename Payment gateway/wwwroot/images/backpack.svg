<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>.backpack { fill: #a16207; stroke: #92400e; stroke-width: 1; }</style>
  </defs>
  <g class="backpack">
    <!-- Main body -->
    <path d="M 30 30 L 35 25 L 65 25 L 70 30 L 70 70 Q 70 75 65 75 L 35 75 Q 30 75 30 70 Z" fill="#a16207" stroke="#92400e" stroke-width="1.5"/>
    <!-- Front pocket -->
    <rect x="35" y="40" width="30" height="25" rx="2" fill="#d97706" stroke="#92400e" stroke-width="1"/>
    <!-- Pocket zipper -->
    <line x1="50" y1="40" x2="50" y2="65" stroke="#92400e" stroke-width="1.5" stroke-dasharray="2,2"/>
    <!-- Left strap -->
    <path d="M 38 25 Q 35 15 38 20" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
    <!-- Right strap -->
    <path d="M 62 25 Q 65 15 62 20" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>